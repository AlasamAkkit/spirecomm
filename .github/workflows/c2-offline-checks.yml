name: C2 offline checks
on:
  push:
    branches: [master, "fyp/**"]
  pull_request:

jobs:
  static-and-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile updated Python files
        run: |
          python -m py_compile spirecomm/test_connection.py spirecomm/test_connection_c2_a10.py spirecomm/finalize_pending_review.py reflection/active_review.py reflection/feedback_app.py reflection/followup_reflection.py
      - name: Offline feedback review tests (no LLM calls)
        run: |
          python -m unittest discover -s reflection/tests -p "test_*.py" -v
